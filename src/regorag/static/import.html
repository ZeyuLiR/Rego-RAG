<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>资料导入与审核</title>
<style>
/* Layout: one working column. Import on top (drop zone + paste box + progress), the review queue below. */
:root {
  --bg: #f5f7f7; --surface: #ffffff; --fg: #17201f; --muted: #5d6b69; --line: #d9e1df;
  --accent: #0f6e66; --accent-ink: #ffffff; --accent-soft: #e1f0ee;
  --warn: #9a5b00; --warn-soft: #fbf0dd; --bad: #b3261e; --bad-soft: #fbe5e3; --good: #1f7a3a; --good-soft: #e2f3e7;
  --sans: -apple-system, "Segoe UI", "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
  --mono: ui-monospace, "SF Mono", Consolas, Menlo, monospace;
}
@media (prefers-color-scheme: dark) { :root {
  --bg: #111716; --surface: #182120; --fg: #e6eeec; --muted: #9aa9a6; --line: #2a3634;
  --accent: #5cc3b8; --accent-ink: #0b1514; --accent-soft: #1b3330;
  --warn: #f0b45c; --warn-soft: #33281a; --bad: #ff8a80; --bad-soft: #3a1f1d; --good: #7fd49a; --good-soft: #1c3324; color-scheme: dark } }
* { box-sizing: border-box; }
[hidden] { display: none !important; }
body { margin: 0; background: var(--bg); color: var(--fg); font: 15px/1.6 var(--sans); }
main { max-width: 880px; margin: 0 auto; padding: 20px 16px 60px; display: grid; gap: 20px; }
header { display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: baseline; justify-content: space-between; }
h1 { margin: 0; font-size: 21px; font-weight: 600; }
h2 { margin: 0; font-size: 16px; font-weight: 600; }
a { color: var(--accent); }
.muted { color: var(--muted); font-size: 13px; }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 16px; display: grid; gap: 12px; min-width: 0; }
#drop { border: 2px dashed var(--line); border-radius: 10px; padding: 28px 16px; text-align: center; cursor: pointer; display: grid; gap: 4px; }
#drop.over { border-color: var(--accent); background: var(--accent-soft); }
#drop b { font-size: 16px; font-weight: 600; }
.files { display: flex; flex-wrap: wrap; gap: 6px; }
.file { display: inline-flex; gap: 6px; align-items: center; font: 13px var(--mono); border: 1px solid var(--line); border-radius: 999px; padding: 2px 4px 2px 10px; max-width: 100%; }
.file span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.file button { border: 0; background: none; color: var(--muted); padding: 0 6px; font-size: 15px; }
textarea, input[type=text], input[type=password], select { font: inherit; color: var(--fg); background: var(--bg); border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; min-width: 0; }
textarea { width: 100%; resize: vertical; }
#paste { min-height: 110px; }
.check { display: flex; gap: 8px; align-items: center; font-size: 14px; }
.attach { display: grid; gap: 4px; }
.note { border-left: 3px solid var(--line); padding-left: 10px; white-space: pre-wrap; }
.row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.row .grow { flex: 1 1 auto; }
button { font: 500 14px var(--sans); border-radius: 8px; border: 1px solid var(--line); background: var(--surface); color: var(--fg); padding: 7px 14px; cursor: pointer; }
button.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
button.danger { color: var(--bad); border-color: var(--bad); }
button:disabled { opacity: .5; cursor: default; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.jobs { display: grid; gap: 6px; }
.job { display: flex; gap: 10px; align-items: baseline; font-size: 14px; flex-wrap: wrap; }
.job .name { font-family: var(--mono); font-size: 13px; overflow-wrap: anywhere; }
.pill { font-size: 12px; padding: 1px 8px; border-radius: 999px; white-space: nowrap; }
.pill.queued { background: var(--bg); color: var(--muted); border: 1px solid var(--line); }
.pill.running { background: var(--accent-soft); color: var(--accent); }
.pill.done { background: var(--good-soft); color: var(--good); }
.pill.error { background: var(--bad-soft); color: var(--bad); }
.err { color: var(--bad); font-size: 13px; }
.ok { color: var(--good); font-size: 13px; }
.proposal { border-top: 1px solid var(--line); padding-top: 14px; display: grid; gap: 10px; }
.proposal:first-of-type { border-top: 0; padding-top: 0; }
.change { border: 1px solid var(--line); border-radius: 10px; padding: 12px; display: grid; gap: 8px; min-width: 0; }
.change.off { opacity: .6; }
.change-head { display: flex; gap: 8px; align-items: baseline; flex-wrap: wrap; }
.change-head label { display: inline-flex; gap: 8px; align-items: baseline; font-weight: 600; cursor: pointer; }
.id { font: 12px var(--mono); color: var(--muted); }
.act { font-size: 12px; padding: 1px 8px; border-radius: 4px; font-weight: 600; }
.act.new { background: var(--good-soft); color: var(--good); }
.act.update { background: var(--accent-soft); color: var(--accent); }
.act.retire, .act.conflict { background: var(--bad-soft); color: var(--bad); }
.act.duplicate { background: var(--bg); color: var(--muted); border: 1px solid var(--line); }
blockquote { margin: 0; padding: 4px 10px; border-left: 3px solid var(--line); color: var(--muted); font-size: 13px; overflow-wrap: anywhere; }
details summary { cursor: pointer; color: var(--accent); font-size: 14px; }
details textarea { font: 13px/1.5 var(--mono); min-height: 260px; margin-top: 8px; }
.empty { color: var(--muted); font-size: 14px; }
.item { border: 1px solid var(--line); border-radius: 10px; padding: 12px; display: grid; gap: 8px; min-width: 0; }
.why { font-size: 13px; padding: 6px 10px; border-radius: 8px; background: var(--warn-soft); color: var(--warn); }
.why.bad { background: var(--bad-soft); color: var(--bad); }
.answer { white-space: pre-wrap; font-size: 14px; overflow-wrap: anywhere; }
.toeval { display: grid; gap: 6px; border-top: 1px dashed var(--line); padding-top: 8px; }
</style>
</head>
<body>
<main>
  <header>
    <h1>资料导入与审核</h1>
    <span class="muted"><a href="/">去问答页</a> · <a href="/eval">评测集</a> · <span id="backend"></span></span>
  </header>

  <section class="panel" id="auth" hidden>
    <h2>需要管理口令</h2>
    <div class="row"><input type="password" id="token" class="grow" placeholder="REGORAG_ADMIN_TOKEN"><button class="primary" id="tokenGo" type="button">进入</button></div>
  </section>

  <section class="panel" id="importPanel">
    <h2>导入资料</h2>
    <div id="drop" tabindex="0" role="button" aria-label="选择或拖入文件">
      <b>把文件拖到这里，可以一次放多个</b>
      <span class="muted" id="acceptHint">PDF、Word、Outlook 邮件（.msg / .eml）、文本，也可以点这里选择文件</span>
    </div>
    <input type="file" id="picker" multiple hidden>
    <div class="files" id="files"></div>
    <textarea id="paste" placeholder="粘贴邮件或通知的文字；也可以写一句说明，例如“这几份都是 de-rego 流程用的：流程、信件模板和填好的例子”"></textarea>
    <label class="muted check" id="sepRow" hidden><input type="checkbox" id="separate"> 每份资料分开整理（默认把这一批文件和文字放在一起看）</label>
    <div class="row">
      <label class="muted" for="collection">放进</label>
      <select id="collection"></select>
      <span class="grow"></span>
      <button class="primary" id="go" type="button" disabled>开始整理</button>
    </div>
    <div class="err" id="importErr"></div>
    <div class="jobs" id="jobs"></div>
  </section>

  <section class="panel" id="checkPanel" hidden>
    <h2>需要复核的回答 <span id="checkCount" class="muted"></span></h2>
    <div class="muted">回答里的数字在引用的文章中找不到，或 clerk 点了“有错”。请核对文章：需要改就在上面导入正确资料，或直接改 kb/ 里的文章；处理完点“已处理”。</div>
    <div id="checks"></div>
  </section>

  <section class="panel">
    <div class="row">
      <h2 class="grow">待审核 <span id="count" class="muted"></span></h2>
      <label class="muted" for="reviewer">审核人</label>
      <select id="reviewer"></select>
    </div>
    <div id="queue"><div class="empty">加载中…</div></div>
  </section>
</main>

<script>
const $ = (id) => document.getElementById(id);
const store = { get(k) { try { return localStorage.getItem(k) || ''; } catch (e) { return ''; } },
                set(k, v) { try { localStorage.setItem(k, v); } catch (e) {} } };
let staged = [];
let polling = null;

async function call(path, opts = {}) {
  const headers = Object.assign({}, opts.headers || {}, { 'X-Admin-Token': store.get('rego-admin-token') });
  const r = await fetch(path, Object.assign({}, opts, { headers }));
  if (r.status === 401) { $('auth').hidden = false; throw new Error('需要管理口令'); }
  const body = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(body.detail || ('出错了（' + r.status + '）'));
  return body;
}
function el(tag, cls, text) { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; }

// ---------------------------------------------------------------- import
function renderStaged() {
  const box = $('files'); box.replaceChildren();
  staged.forEach((f, i) => {
    const chip = el('span', 'file'); chip.append(el('span', null, f.name));
    const x = el('button', null, '×'); x.type = 'button'; x.title = '移除'; x.onclick = () => { staged.splice(i, 1); renderStaged(); };
    chip.append(x); box.append(chip);
  });
  updateGo();
}
function updateGo() {
  const text = $('paste').value.trim() ? 1 : 0, n = staged.length + text;
  const together = staged.length > 0 && n > 1 && !$('separate').checked;
  $('sepRow').hidden = n < 2;
  $('go').disabled = n === 0;
  $('go').textContent = together ? `一起整理（${staged.length} 个文件${text ? ' + 文字' : ''}）`
    : n > 1 ? `分别整理（${n} 份）` : '开始整理';
}
function addFiles(list) { for (const f of list) if (!staged.some(s => s.name === f.name && s.size === f.size)) staged.push(f); renderStaged(); }
const drop = $('drop');
drop.onclick = () => $('picker').click();
drop.onkeydown = (e) => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); $('picker').click(); } };
$('picker').onchange = (e) => { addFiles(e.target.files); e.target.value = ''; };
['dragenter', 'dragover'].forEach(t => drop.addEventListener(t, (e) => { e.preventDefault(); drop.classList.add('over'); }));
['dragleave', 'drop'].forEach(t => drop.addEventListener(t, (e) => { e.preventDefault(); drop.classList.remove('over'); }));
drop.addEventListener('drop', (e) => addFiles(e.dataTransfer.files));
// Dropping anywhere on the page should not open the file in the browser.
window.addEventListener('dragover', (e) => e.preventDefault());
window.addEventListener('drop', (e) => { e.preventDefault(); if (e.target !== drop && !drop.contains(e.target)) addFiles(e.dataTransfer.files); });
$('paste').addEventListener('input', updateGo);
$('separate').addEventListener('change', updateGo);

$('go').onclick = async () => {
  $('importErr').textContent = ''; $('go').disabled = true;
  const fd = new FormData();
  staged.forEach(f => fd.append('files', f, f.name));
  fd.append('text', $('paste').value);
  fd.append('collection', $('collection').value);
  fd.append('separate', $('separate').checked ? 'true' : 'false');
  try {
    await call('/api/import', { method: 'POST', body: fd });
    staged = []; $('paste').value = ''; $('separate').checked = false; renderStaged();
    pollJobs();
  } catch (e) { $('importErr').textContent = e.message; updateGo(); }
};

const STATUS = { queued: '排队中', running: '正在整理', done: '已完成', error: '出错' };
async function pollJobs() {
  clearTimeout(polling);
  let jobs = [];
  try { jobs = (await call('/api/import/jobs')).jobs; } catch (e) { return; }
  const box = $('jobs'); box.replaceChildren();
  for (const j of jobs.slice(0, 20)) {
    const row = el('div', 'job');
    row.append(el('span', 'pill ' + j.status, STATUS[j.status]), el('span', 'name', j.name));
    if (j.status === 'done') row.append(el('span', 'muted', !j.changes ? '没有需要修改的内容，见下方'
      : (j.proposals || []).length > 1 ? `分成 ${j.proposals.length} 份审核，共 ${j.changes} 处改动，见下方` : `${j.changes} 处改动，见下方待审核`));
    if (j.status === 'error') row.append(el('span', 'err', j.error));
    box.append(row);
  }
  const busy = jobs.some(j => j.status === 'queued' || j.status === 'running');
  const doneNow = jobs.filter(j => j.status === 'done').length;
  if (doneNow !== pollJobs.done) { pollJobs.done = doneNow; loadQueue(); }
  if (busy) polling = setTimeout(pollJobs, 2500);
}

// ---------------------------------------------------------------- review queue
const ACT = { new: '新增', update: '更新', retire: '作废', duplicate: '重复', conflict: '冲突' };
const APPLIES = new Set(['new', 'update', 'retire']);

async function loadQueue() {
  let props;
  try { props = (await call('/api/proposals')).proposals; } catch (e) { $('queue').replaceChildren(el('div', 'err', e.message)); return; }
  $('count').textContent = props.length ? `（${props.length}）` : '';
  const box = $('queue'); box.replaceChildren();
  if (!props.length) { box.append(el('div', 'empty', '没有待审核的提案。导入资料后，整理结果会出现在这里。')); return; }
  props.forEach(p => box.append(renderProposal(p)));
}

function renderProposal(p) {
  const wrap = el('div', 'proposal');
  const head = el('div', 'row');
  head.append(el('strong', 'grow', p.topic || p.source), el('span', 'muted', p.name.slice(0, 10)));
  wrap.append(head);
  if (p.topic) wrap.append(el('div', 'muted', '资料：' + p.source));
  if (p.note) wrap.append(el('div', 'note muted', '说明：' + p.note));
  wrap.append(el('div', null, p.source_summary_zh));
  const picks = [];
  if (!p.changes.length) wrap.append(el('div', 'muted', '模型认为这批资料不需要修改知识库。可以直接驳回归档。'));
  for (const c of p.changes) {
    const card = el('div', 'change');
    const h = el('div', 'change-head');
    const label = el('label');
    const cb = el('input'); cb.type = 'checkbox'; cb.id = `pick-${p.name}-${c.article_id}`;
    cb.checked = APPLIES.has(c.action); cb.disabled = !APPLIES.has(c.action);
    cb.onchange = () => card.classList.toggle('off', !cb.checked);
    const pick = { id: c.article_id, cb, files: [] };
    if (cb.checked) picks.push(pick);
    label.append(cb, el('span', 'act ' + c.action, ACT[c.action] || c.action), el('span', null, c.title));
    h.append(label, el('span', 'id', c.article_id));
    card.append(h, el('div', null, c.summary_zh));
    if (c.effective_from) card.append(el('div', 'muted', '生效日期：' + c.effective_from));
    if ((p.sources || []).length > 1 && (c.source_files || []).length) card.append(el('div', 'muted', '依据：' + c.source_files.join('、')));
    if (c.draft != null && (p.originals || []).length) {
      // The reviewer decides which uploaded files are stored with this article for download.
      const box = el('div', 'attach');
      box.append(el('div', 'muted', '作为附件存进知识库（clerk 提问时可以下载）：'));
      for (const name of p.originals) {
        const l = el('label', 'check'); const f = el('input'); f.type = 'checkbox';
        f.checked = (c.attached || []).includes(name);
        pick.files.push({ name, f });
        l.append(f, el('span', null, name)); box.append(l);
      }
      card.append(box);
    }
    for (const q of c.evidence || []) card.append(el('blockquote', null, q));
    if (c.draft != null) {
      const d = el('details'); d.append(el('summary', null, '查看或修改草稿'));
      const ta = el('textarea'); ta.id = `draft-${p.name}-${c.article_id}`; ta.value = c.draft; ta.spellcheck = false;
      const save = el('button', null, '保存修改'); save.type = 'button';
      const msg = el('span', 'muted');
      save.onclick = async () => {
        msg.className = 'muted'; msg.textContent = '保存中…';
        try { await call(`/api/proposals/${encodeURIComponent(p.name)}/drafts/${encodeURIComponent(c.article_id)}`,
          { method: 'PUT', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ content: ta.value }) });
          msg.className = 'ok'; msg.textContent = '已保存'; }
        catch (e) { msg.className = 'err'; msg.textContent = e.message; }
      };
      const r = el('div', 'row'); r.append(save, msg);
      d.append(ta, r); card.append(d);
    }
    wrap.append(card);
  }
  const actions = el('div', 'row');
  const approve = el('button', 'primary', '通过所选并发布'); approve.type = 'button';
  const reject = el('button', 'danger', '驳回'); reject.type = 'button';
  const msg = el('span', 'muted grow');
  approve.disabled = !picks.length;
  approve.onclick = async () => {
    const reviewer = $('reviewer').value;
    const only = picks.filter(x => x.cb.checked).map(x => x.id);
    const attachments = {};
    for (const x of picks) if (x.cb.checked && x.files.length) attachments[x.id] = x.files.filter(y => y.f.checked).map(y => y.name);
    if (!only.length) { msg.className = 'err grow'; msg.textContent = '请至少勾选一项。'; return; }
    approve.disabled = reject.disabled = true; msg.className = 'muted grow'; msg.textContent = '发布中…';
    try {
      const r = await call(`/api/proposals/${encodeURIComponent(p.name)}/apply`,
        { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ reviewer, only, attachments }) });
      msg.className = 'ok grow';
      msg.textContent = `已发布 ${r.published.length} 篇` + (r.commit ? `，已记入 Git（${r.commit}）` : '') + '。问答页马上就能用到。';
      setTimeout(loadQueue, 2500);
    } catch (e) { msg.className = 'err grow'; msg.textContent = e.message; approve.disabled = reject.disabled = false; }
  };
  let armed = false;
  reject.onclick = async () => {
    if (!armed) { armed = true; reject.textContent = '确认驳回？'; setTimeout(() => { armed = false; reject.textContent = '驳回'; }, 4000); return; }
    approve.disabled = reject.disabled = true;
    try { await call(`/api/proposals/${encodeURIComponent(p.name)}/reject`, { method: 'POST' }); wrap.remove(); loadQueue(); }
    catch (e) { msg.className = 'err grow'; msg.textContent = e.message; approve.disabled = reject.disabled = false; }
  };
  actions.append(msg, reject, approve);
  wrap.append(actions);
  return wrap;
}

// ---------------------------------------------------------------- answers to check
async function loadChecks() {
  let items;
  try { items = (await call('/api/review/items')).items; } catch (e) { return; }
  $('checkPanel').hidden = !items.length;
  $('checkCount').textContent = items.length ? `（${items.length}）` : '';
  $('checks').replaceChildren(...items.map(renderCheck));
}
function renderCheck(it) {
  const box = el('div', 'item');
  const when = new Date(it.ts * 1000).toLocaleString('zh-CN', { hour12: false });
  const head = el('div', 'row');
  head.append(el('strong', 'grow', it.question), el('span', 'muted', (it.user_name || '未署名') + ' · ' + when));
  box.append(head);
  if ((it.unverified || []).length) box.append(el('div', 'why', '数字没有出处：' + it.unverified.join('、')));
  if (it.feedback === 'down') box.append(el('div', 'why bad', 'clerk 反馈有错' + (it.comment ? '：' + it.comment : '')));
  const cited = (it.source_links || []).map(s => s.title + (s.path ? '（' + s.path + '）' : ''));
  box.append(el('div', 'muted', cited.length ? '引用：' + cited.join('；') : '没有引用文章'));
  const d = el('details'); d.append(el('summary', null, '看回答原文'), el('div', 'answer', it.answer)); box.append(d);

  const note = el('input'); note.type = 'text'; note.className = 'grow'; note.placeholder = '处理说明，例如“已更新 reg-renewal 的费用”';
  const done = el('button', 'primary', '已处理'); done.type = 'button';
  const toEval = el('button', null, '加入评测集'); toEval.type = 'button';
  const msg = el('span', 'muted');
  done.onclick = async () => {
    done.disabled = true;
    try {
      await call(`/api/review/items/${it.id}/resolve`, { method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ reviewer: $('reviewer').value, note: note.value }) });
      box.remove(); loadChecks();
    } catch (e) { msg.className = 'err'; msg.textContent = e.message; done.disabled = false; }
  };
  toEval.onclick = () => {
    toEval.disabled = true;
    const f = el('div', 'toeval');
    const facts = el('input'); facts.type = 'text'; facts.placeholder = '正确答案必须包含的要点，用 ; 分开，例如：$45; Blue Slip; 14 days';
    const expect = el('input'); expect.type = 'text'; expect.value = [...new Set((it.sources || []).map(s => s.split('#')[0]))].join(', ');
    expect.placeholder = '应引用的文章 id，用逗号分开';
    const refuse = el('input'); refuse.type = 'checkbox';
    const rl = el('label', 'check'); rl.append(refuse, el('span', null, '知识库没有这个内容，正确做法是说不知道'));
    const save = el('button', 'primary', '保存到评测集'); save.type = 'button';
    const m = el('span', 'muted');
    save.onclick = async () => {
      save.disabled = true;
      const split = (v, sep) => v.split(sep).map(x => x.trim()).filter(Boolean);
      try {
        await call(`/api/review/items/${it.id}/to-eval`, { method: 'POST', headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ question: it.question, collection: it.collection || 'rego',
            expect: split(expect.value, /[,，]/), must_include: split(facts.value, /[;；]/), should_refuse: refuse.checked,
            added_by: $('reviewer').value, notes: '来自问答反馈' + (it.comment ? '：' + it.comment : '') }) });
        m.className = 'ok'; m.textContent = '已加入评测集';
      } catch (e) { m.className = 'err'; m.textContent = e.message; save.disabled = false; }
    };
    const r = el('div', 'row'); r.append(save, m);
    f.append(el('div', 'muted', '应引用的文章'), expect, el('div', 'muted', '必备要点'), facts, rl, r);
    box.append(f); facts.focus();
  };
  const actions = el('div', 'row'); actions.append(note, toEval, done);
  box.append(actions, msg);
  return box;
}

// ---------------------------------------------------------------- start
async function start() {
  let info;
  try { info = await call('/api/admin/info'); } catch (e) { return; }
  $('auth').hidden = true;
  $('backend').textContent = info.backend === 'claude-code' ? '通过 Claude Code 调用（不走 API）' : '通过 API 调用';
  $('acceptHint').textContent = `支持 ${info.accept.join(' ')}，每个不超过 ${info.max_mb} MB。也可以点这里选择文件。`;
  $('picker').accept = info.accept.join(',');
  $('collection').replaceChildren(...Object.entries(info.collections).map(([k, t]) => { const o = el('option', null, t); o.value = k; return o; }));
  $('reviewer').replaceChildren(...info.reviewers.map(n => { const o = el('option', null, n); o.value = n; return o; }));
  if (store.get('rego-reviewer')) $('reviewer').value = store.get('rego-reviewer');
  loadChecks(); loadQueue(); pollJobs();
}
$('reviewer').onchange = () => store.set('rego-reviewer', $('reviewer').value);
$('tokenGo').onclick = () => { store.set('rego-admin-token', $('token').value); start(); };
start();
</script>
</body>
